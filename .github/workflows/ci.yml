name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit (high 以上で失敗。除外は scripts/audit.mjs に理由と期限つきで書く)
        run: node scripts/audit.mjs
        # Dependabot の PR では失敗させない。一部の脆弱性だけを直す更新でも、
        # 残りの脆弱性で落ちて取り込めなくなるため。取り込むかどうかは
        # dependabot-security-merge.yml が更新前後の件数で判定する。
        continue-on-error: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_INDEX_NAME: morrison_bib
          ALLOWED_INDICES: morrison_bib

      # 資料ページを返す Astro のアプリ (apps/item)。deploy.yml の item ジョブと同じ手順でビルドまで確かめる
      - name: Typecheck item (Astro)
        working-directory: apps/item
        run: npm run typecheck
      - name: Unit tests item (vitest)
        working-directory: apps/item
        run: npm test
      - name: Build item (Astro)
        working-directory: apps/item
        run: npm run build
