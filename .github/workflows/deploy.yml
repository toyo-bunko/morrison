name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: 'deploy'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Build (OpenNext for Cloudflare Workers)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_INDEX_NAME: morrison_bib
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

      - name: Page smoke test (rendered HTML)
        env:
          BASE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # 正式公開まで Basic 認証がかかっているので、確認もその鍵で入る。
          # 認証を外したら、この 2 つの secret も消してよい (無くても動く)。
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: node apps/web/scripts/test-pages.js
